{% extends "base.html" %}

{% block title %}Suggestion Form - UniSync{% endblock %}

{% block styles %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/complaint.css') }}">

{% endblock %}

{% block content %}

<div class="complaint-container">


<div class="complaint-card">

    <div class="complaint-header">

        <p class="complaint-label">UNISYNC</p>

        <h2>Submit a Suggestion</h2>

        <p>
            Your suggestion will be submitted anonymously.
            Help us improve campus services and student life.
        </p>

    </div>

    <form method="POST" action="{{ url_for('submit_suggestion') }}">

        <div class="form-group">

            <label for="suggestion">Suggestion</label>

            <textarea
                id="suggestion"
                name="suggestion"
                rows="7"
                placeholder="Share your suggestion..."
                required
            ></textarea>

        </div>

        <button type="submit">Submit Suggestion</button>

    </form>

</div>


</div>

{% endblock %}
