{% extends "base.html" %}

{% block title %}Submit Complaint - UniSync{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/complaint.css') }}">
{% endblock %}

{% block content %}

<div class="complaint-container">

    <div class="complaint-card">

        <div class="complaint-header">
            <p class="complaint-label">UNISYNC</p>
            <h2>Submit a Complaint</h2>
            <p>
                Your complaint will be submitted anonymously.
                You will receive a Complaint ID to track it later.
            </p>
        </div>

        <form method="POST" action="{{ url_for('submit_complaint') }}">

            <div class="form-group">
    <label for="category">Complaint Category</label>

    <select id="category" name="category" required>

        <option value="" disabled
            {% if not selected_category %}selected{% endif %}>
            Select a category
        </option>

        {% for category in [
            'Academic', 'Hostel', 'Payments', 'Transport',
            'Food', 'Internet & IT', 'Security', 'Other'
        ] %}

            <option value="{{ category }}"
                {% if selected_category == category %}selected{% endif %}>
                {{ category }}
            </option>

        {% endfor %}

    </select>
</div>

            <div class="form-group">
                <label for="description">Complaint</label>

                <textarea
                    id="description"
                    name="description"
                    rows="7"
                    placeholder="Describe your complaint..."
                    required
                ></textarea>
            </div>

            <button type="submit">Submit Complaint</button>

        </form>

    </div>

</div>

{% endblock %}
