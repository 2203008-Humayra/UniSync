{% extends "base.html" %}

{% block title %}Submit Complaint - UniSync{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/complaint.css') }}">
{% endblock %}

{% block content %}

<div class="complaint-container">

    <div class="complaint-card">

        <div class="complaint-header">
            <p class="complaint-label">UNISYNC</p>
            <h2>Submit a Complaint</h2>
            <p>
                Your complaint will be submitted anonymously.
                You will receive a Complaint ID to track it later.
            </p>
        </div>

        <form method="POST" action="{{ url_for('submit_complaint') }}">

            <div class="form-group">
                <label for="category">Complaint Category</label>

                <select id="category" name="category" required>
                    <option value="" disabled selected>
                        Select a category
                    </option>
                    <option value="Academic">Academic</option>
                    <option value="Hostel">Hostel</option>
                    <option value="Payments">Payments</option>
                    <option value="Transport">Transport</option>
                    <option value="Food">Food</option>
                    <option value="Internet & IT">Internet & IT</option>
                    <option value="Security">Security</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Complaint</label>

                <textarea
                    id="description"
                    name="description"
                    rows="7"
                    placeholder="Describe your complaint..."
                    required
                ></textarea>
            </div>

            <button type="submit">Submit Complaint</button>

        </form>

    </div>

</div>

{% endblock %}
