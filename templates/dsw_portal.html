{% extends "base.html" %}

{% block title %}DSW Login - UniSync{% endblock %}

{% block styles %}
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/dsw_portal.css') }}"
>
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-box">

        <div class="login-header">
            <span class="login-label">UNISYNC</span>

            <h2>DSW Portal</h2>

            <p>Director of Student Welfare</p>
        </div>

        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="password-row">
                <a href="{{ url_for('forgot_password')}}" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit">Sign in</button>

        </form>

    </div>

</div>

{% endblock %}
